# Netlify reads this file from the base directory — the repository root by
# default — and resolves `publish` relative to it.
#
# This repository is a monorepo: the root holds the console brief, brand
# assets and the archived prototype, and the website itself lives in site/.
# So the publish root is site/, not the repository root. Without this file a
# deploy from this repo would publish a directory containing no index.html.
#
# No `command`, deliberately. Nothing is built at deploy time; the site is
# served exactly as committed. The menu page generator described in
# docs/site/2026-09-06-menu-crawlability-plan.md runs locally and its output
# is committed like any other source file.
#
# _headers, robots.txt and sitemap.xml are read from the publish directory,
# so site/_headers is served as /_headers, site/robots.txt as /robots.txt,
# and so on. They need no separate configuration.
#
# The base directory is the repository root, so this is the file Netlify
# reads. A site/netlify.toml for the alternative wiring — base directory set
# to site/, publish = "." — used to sit alongside it, unread; it was deleted
# once the base directory was confirmed. Recover it from git history if the
# wiring ever changes.

[build]
  publish = "site"
