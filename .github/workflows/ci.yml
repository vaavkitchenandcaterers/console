name: CI

# Netlify auto-publish is locked for this site: every push to main still
# builds and gets its own deploy URL, but production stays pinned to the
# last published deploy until a human clicks Publish in Netlify. That click
# is the release authorisation.
#
# This workflow is the verification half. It reports pass or fail on the
# commit, so whoever is about to publish can see whether the tests, links
# and generated pages are sound. Nothing here can publish, and nothing here
# mechanically blocks a publish -- the gate is a person reading a result.
# Release steps are in README.md.
#
# Before publishing you can also point the smoke test at the Netlify deploy
# URL, either locally:
#
#   node tools/smoke-check.mjs https://<deploy-id>--<site>.netlify.app
#
# or by running this workflow from the Actions tab with that URL as input.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      smoke_url:
        description: Deploy URL to smoke-test before publishing (optional)
        required: false
        type: string

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: tests and site checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # One version deliberately. Nothing here runs on Node in production;
          # the deployed site is static, so a version matrix would guard
          # against a risk this project does not carry.
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci
        working-directory: site

      # 92 tests across six files, including the byte-identical comparison of
      # each generated menu page against renderCategoryPage().
      - name: Tests
        run: npm test
        working-directory: site

      # The site serves each page at one clean URL and cross-links by
      # root-relative path, so a rename breaks quietly: the deploy succeeds
      # and the page 404s.
      - name: Internal links and sitemap resolve
        run: node tools/check-internal-links.mjs

      # Runs the generator itself, so its write path is exercised too, not
      # just the template function the test suite calls directly.
      - name: Regenerate the menu category pages
        run: npm run build:menu
        working-directory: site

      - name: Fail if the generated pages moved
        run: |
          # Deliberately git diff, not git status --porcelain. With
          # core.autocrlf on, status reports a regenerated file as modified
          # purely because its working-tree line endings differ, even when
          # the content git would store is byte-identical. git diff re-hashes
          # through the same normalisation a commit would apply.
          if ! git diff --quiet -- site/menu; then
            echo "::error::site/menu is stale. Run 'npm run build:menu' in site/ and commit the result."
            git --no-pager diff -- site/menu
            exit 1
          fi
          untracked=$(git ls-files --others --exclude-standard -- site/menu)
          if [ -n "$untracked" ]; then
            echo "::error::the generator produced files that are not committed:"
            echo "$untracked"
            exit 1
          fi
          echo "Committed pages are byte-identical to the generator output."

      - name: Every category has a page, every page has a category
        run: node tools/check-menu-coverage.mjs

  smoke:
    name: smoke-test a deploy URL
    if: github.event_name == 'workflow_dispatch' && inputs.smoke_url != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Exercises the deployed copy rather than the repository: a build that
      # published nothing, or from the wrong directory, passes every
      # file-level check above and fails here.
      - name: Fetch every page and check it serves
        run: node tools/smoke-check.mjs "${{ inputs.smoke_url }}"
