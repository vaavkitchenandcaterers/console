<!-- Fonts are self-hosted: the @font-face rules open /style.css. These three
     are the Latin files the hero paints with (h1, body copy, nav and buttons);
     every other face loads on demand through its unicode-range. -->
<link rel="preload" href="/fonts/cormorant-700-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/mukta-400-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/catamaran-600-800-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/style.css">
<!-- script.js's import graph, so its five imports download alongside it
     instead of after it. site/perf-head.test.js keeps this list honest. -->
<link rel="modulepreload" href="/script.js">
<link rel="modulepreload" href="/shortlist.js">
<link rel="modulepreload" href="/menu-format.js">
<link rel="modulepreload" href="/lead-events.js">
<link rel="modulepreload" href="/quote-form.js">
<link rel="modulepreload" href="/reviews.js">
<!-- Google Analytics (GA4). Both halves are in /analytics.js now: the config
     so script-src needs no 'unsafe-inline' (ADR-0009), and the loader, which
     that file fetches after paint or on first interaction rather than racing
     the hero from here (ADR-0012). -->
<script src="/analytics.js" defer></script>
